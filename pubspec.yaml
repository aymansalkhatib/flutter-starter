name: flutter_starter
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  dio: ^5.9.2
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  connectivity_plus: ^7.1.1
  get_it: ^9.2.1
  cached_network_image: ^3.4.1
  skeletonizer: ^2.1.3
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  device_preview: ^1.3.1
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  flutter_svg: ^2.2.4
  google_sign_in: ^7.2.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  file_picker: ^11.0.2
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  hive_ce_generator: ^1.11.1
  build_runner: ^2.13.1
  json_serializable: ^6.13.1
  freezed: ^3.2.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/fonts/almarai/
    - assets/fonts/lato/
    - assets/fonts/open_sans/
    - assets/fonts/readex_pro/
    - assets/translations/
    - assets/locales/

  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/almarai/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/almarai/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/almarai/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/almarai/Almarai-ExtraBold.ttf
          weight: 800
    - family: Lato
      fonts:
        - asset: assets/fonts/lato/Lato-Thin.ttf
          weight: 100
        - asset: assets/fonts/lato/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/lato/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/lato/Lato-Medium.ttf
          weight: 500
        - asset: assets/fonts/lato/Lato-Semibold.ttf
          weight: 600
        - asset: assets/fonts/lato/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/lato/Lato-Black.ttf
          weight: 900
    - family: OpenSans
      fonts:
        - asset: assets/fonts/open_sans/OpenSans-Light.ttf
          weight: 300
        - asset: assets/fonts/open_sans/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/open_sans/OpenSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/open_sans/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/open_sans/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/open_sans/OpenSans-ExtraBold.ttf
          weight: 800
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/readex_pro/ReadexPro-Light.ttf
          weight: 300
        - asset: assets/fonts/readex_pro/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/readex_pro/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/readex_pro/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/readex_pro/ReadexPro-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path_android: assets/images/logo_icon_black.png
  image_path_ios: assets/images/logo_icon_white.png

flutter_native_splash:
  android: true
  ios: true
  web: false

  color: "#FFFFFF"
  color_dark: "#181818"

  image: assets/images/logo-square-black.png
  image_dark: assets/images/logo-square-white.png

  android_12:
    color: "#FFFFFF"
    color_dark: "#181818"
    image: assets/images/logo-black-android12-hd.png
    image_dark: assets/images/logo-white-android12-hd.png
