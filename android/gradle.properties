org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

android.useAndroidX=true

# --- Size reduction flags ---
# R8 full mode: more aggressive shrinking & obfuscation than compat mode.
android.enableR8.fullMode=true
# Each module only has its own R class (smaller dex, faster build).
android.nonTransitiveRClass=true
# Resource IDs are not final (enables further optimizations in R8).
android.nonFinalResIds=true
# Strip unused resources produced by libraries even when not referenced.
android.enableResourceOptimizations=true
# Don't generate unused BuildConfig fields.
android.defaults.buildfeatures.buildconfig=false
# Disable Jetifier (not needed; AndroidX only).
android.enableJetifier=false
